---
- name: Install OT.io Compose systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/otio-compose.service
    mode: "0644"
    content: |
      [Unit]
      Description=OT.io Docker Compose stack
      Requires=docker.service
      After=docker.service network-online.target

      [Service]
      Type=oneshot
      WorkingDirectory={{ otio_remote_root }}
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      RemainAfterExit=yes
      TimeoutStartSec=0

      [Install]
      WantedBy=multi-user.target
  when: otio_enable_systemd_service | bool

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: otio_enable_systemd_service | bool

- name: Enable OT.io Compose service
  ansible.builtin.systemd:
    name: otio-compose.service
    enabled: true
  when: otio_enable_systemd_service | bool
