apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "otio.prefix" . }}-mqtt}
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ include "otio.prefix" . }}-mqtt}}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/config.yaml") . | sha256sum }}
      labels: {app: {{ include "otio.prefix" . }}-mqtt}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mqtt
          image: {{ .Values.images.mqtt | quote }}
          ports: [{name: mqtt, containerPort: 1883}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {memory: 128Mi}}
          readinessProbe: {tcpSocket: {port: mqtt}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: mqtt}, periodSeconds: 15}
          volumeMounts: [{name: config, mountPath: /mosquitto/config, readOnly: true}]
      volumes: [{name: config, configMap: {name: {{ include "otio.prefix" . }}-mosquitto-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "otio.prefix" . }}-rabbitmq}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: {{ include "otio.prefix" . }}-rabbitmq}}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/config.yaml") . | sha256sum }}
      labels: {app: {{ include "otio.prefix" . }}-rabbitmq}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rabbitmq
          image: {{ .Values.images.rabbitmq | quote }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: {{ include "otio.prefix" . }}-otio-credentials, key: RABBITMQ_DEFAULT_USER}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: {{ include "otio.prefix" . }}-otio-credentials, key: RABBITMQ_DEFAULT_PASS}}
          ports: [{name: amqp, containerPort: 5672}, {name: management, containerPort: 15672}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 768Mi}}
          startupProbe: {tcpSocket: {port: amqp}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {tcpSocket: {port: amqp}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: amqp}, periodSeconds: 15}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "otio.prefix" . }}-postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: {{ include "otio.prefix" . }}-postgres}}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/config.yaml") . | sha256sum }}
      labels: {app: {{ include "otio.prefix" . }}-postgres}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "otio.prefix" . }}-otio-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "otio.prefix" . }}-otio-credentials, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: {{ include "otio.prefix" . }}-otio-credentials, key: POSTGRES_DB}}
          ports: [{name: postgres, containerPort: 5432}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
          startupProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
          livenessProbe: {tcpSocket: {port: postgres}, periodSeconds: 15}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: {{ include "otio.prefix" . }}-postgres-data}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "otio.prefix" . }}-protocol-lab}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: {{ include "otio.prefix" . }}-protocol-lab}}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/config.yaml") . | sha256sum }}
      labels: {app: {{ include "otio.prefix" . }}-protocol-lab}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: protocol-lab
          image: {{ .Values.images.protocolLab | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - {name: LAB_HOST, value: '{{ include "otio.prefix" . }}-protocol-lab'}
            - {name: LAB_MQTT_URL, value: 'tcp://{{ include "otio.prefix" . }}-mqtt:1883'}
            - name: LAB_AMQP_URL
              valueFrom: {secretKeyRef: {name: {{ include "otio.prefix" . }}-otio-credentials, key: LAB_AMQP_URL}}
          ports:
            - {name: http, containerPort: 8500}
            - {name: modbus, containerPort: 1502}
            - {name: rtu, containerPort: 1503}
            - {name: opcua, containerPort: 4842}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 15}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "otio.prefix" . }}-sense}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: {{ include "otio.prefix" . }}-sense}}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/config.yaml") . | sha256sum }}
      labels: {app: {{ include "otio.prefix" . }}-sense}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: seed-config
          image: {{ .Values.images.init | quote }}
          command: [sh, -ec, 'if [ ! -f /data/config.json ]; then cp /seed/config.json /data/config.json; fi']
          resources: {requests: {cpu: 10m, memory: 8Mi}, limits: {memory: 32Mi}}
          volumeMounts:
            - {name: seed, mountPath: /seed, readOnly: true}
            - {name: data, mountPath: /data}
      containers:
        - name: sense
          image: {{ .Values.images.sense | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env: [{name: SENSE_UI_PORT, value: '8100'}]
          ports: [{name: http, containerPort: 8100}]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 256Mi}}
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /api/status, port: http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 15}
          volumeMounts: [{name: data, mountPath: /app/config}]
      volumes:
        - {name: seed, secret: {secretName: {{ include "otio.prefix" . }}-sense-config}}
        - {name: data, persistentVolumeClaim: {claimName: {{ include "otio.prefix" . }}-sense-data}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "otio.prefix" . }}-lense}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: {{ include "otio.prefix" . }}-lense}}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/config.yaml") . | sha256sum }}
      labels: {app: {{ include "otio.prefix" . }}-lense}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.images.postgres | quote }}
          command: [sh, -ec, 'until pg_isready -h {{ include "otio.prefix" . }}-postgres -p 5432; do sleep 2; done']
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      containers:
        - name: lense
          image: {{ .Values.images.lense | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - {name: PROTOCOL_LAB_URL, value: 'http://{{ include "otio.prefix" . }}-protocol-lab:8500'}
            - {name: POSTGRES_HOST, value: {{ include "otio.prefix" . }}-postgres}
            - {name: MQTT_BROKER, value: {{ include "otio.prefix" . }}-mqtt}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "otio.prefix" . }}-otio-credentials, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "otio.prefix" . }}-otio-credentials, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: {{ include "otio.prefix" . }}-otio-credentials, key: POSTGRES_DB}}
          ports: [{name: http, containerPort: 8000}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 15}
          volumeMounts: [{name: topology, mountPath: /app/config, readOnly: true}]
      volumes: [{name: topology, configMap: {name: {{ include "otio.prefix" . }}-lense-topology}}]
