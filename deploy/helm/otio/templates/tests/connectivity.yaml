apiVersion: v1
kind: Pod
metadata:
  name: {{ include "otio.prefix" . }}-connectivity-test
  annotations:
    helm.sh/hook: test
    # Keep the completed Pod so helm test --logs can read its output.
    # The next test run deletes it before creating a replacement.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{ toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test
      image: {{ .Values.images.init | quote }}
      resources: {requests: {cpu: 10m, memory: 8Mi}, limits: {memory: 64Mi}}
      command:
        - sh
        - -ec
        - |
          wget -qO- -T 15 http://{{ include "otio.prefix" . }}-lense:8000/protocol-lab/api/catalog | grep -q 'modbus-tcp'
          wget -qO- -T 15 http://{{ include "otio.prefix" . }}-sense:8100/api/status | grep -q '"valid":true'
          wget -qO- -T 15 --header='Content-Type: application/json' --post-data='{"protocol":"opcua-tcp","connection":"opc.tcp://{{ include "otio.prefix" . }}-protocol-lab:4842","address":"ns=1;s=Temperature"}' http://{{ include "otio.prefix" . }}-protocol-lab:8500/api/read | grep -Eq '"value":[[:space:]]*[0-9]'
